buildscript {
    repositories {
        // These repositories are only for Gradle plugins, put any other repositories in the repository block further below
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        mavenCentral()
    }
    dependencies {
        classpath 'org.spongepowered:mixingradle:0.7-SNAPSHOT'
    }
}

plugins {
    id 'maven-publish'
    id 'java-library'
    id 'signing'
    id 'idea'
    id 'net.minecraftforge.gradle' version '5.1.+'
    id 'org.parchmentmc.librarian.forgegradle' version '1.+'
}

apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'eclipse'
apply plugin: 'maven-publish'
apply plugin: 'org.spongepowered.mixin'

group = group_id
version = mod_version

java {
    archivesBaseName = mod_name
    toolchain.languageVersion = JavaLanguageVersion.of(17)
    //withJavadocJar()
    withSourcesJar()
}

minecraft {
    mappings channel: 'parchment', version: '2022.11.06-1.18.2'
    accessTransformer = project.file("src/main/resources/META-INF/accesstransformer.cfg")
    runs {
        client {
            workingDirectory project.file('run')
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'forge.enabledGameTestNamespaces', 'coldsweat'
            mods {
                coldsweat {
                    source sourceSets.main
                }
            }
        }

        server {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'forge.enabledGameTestNamespaces', 'coldsweat'
            mods {
                coldsweat {
                    source sourceSets.main
                }
            }
        }

        gameTestServer {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'forge.enabledGameTestNamespaces', 'coldsweat'
            mods {
                coldsweat {
                    source sourceSets.main
                }
            }
        }

        data {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            args '--mod', 'cold_sweat', '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
            mods {
                cold_sweat {
                    source sourceSets.main
                }
            }
        }
    }
}

mixin {
    add sourceSets.main, "cold_sweat.mixin-refmap.json"
    config 'cold_sweat.mixin.json'
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    mavenCentral()
    maven {
        name = 'Forge'
        url = 'https://maven.minecraftforge.net'
    }
    maven {
        name = 'Minecraft libraries'
        url = 'https://libraries.minecraft.net'
    }
    maven {
        name = 'CurseForge'
        url 'https://www.cursemaven.com'
        content {
            includeGroup "curse.maven"
        }
    }
    maven {
        name = 'Registrate'
        url = 'https://maven.tterrag.com'
    }
    maven {
        name = 'Kotlin'
        url = 'https://thedarkcolour.github.io/KotlinForForge/'
    }
    maven {
        name = "Valkyrien Skies"
        url = 'https://maven.valkyrienskies.org'
    }
    maven {
        name = 'Architectury'
        url = "https://maven.architectury.dev"
        content {
            includeGroup "dev.architectury"
        }
    }
    maven {
        name = 'JitPack'
        url 'https://jitpack.io'
        content {
            includeGroup "com.github.rtyley"
        }
    }
    maven {
        url = "https://maven.teamresourceful.com/repository/maven-public/"
    }
}

dependencies {
    implementation 'com.github.t9t.minecraft-rcon-client:minecraft-rcon-client:1.0.0'
    minecraft 'net.minecraftforge:forge:1.18.2-40.3.11'
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    // Runtime Mods
    //runtimeOnly fg.deobf("curse.maven:spark-361579:4505375")
    runtimeOnly fg.deobf("curse.maven:jei-238222:3940240")
    runtimeOnly fg.deobf("curse.maven:byg-247560:4036050")
    runtimeOnly fg.deobf("curse.maven:biomesoplenty-220318:3759236")
    runtimeOnly fg.deobf("curse.maven:terrablender-563928:3816497")
    runtimeOnly fg.deobf("curse.maven:coroutil-237749:4426517")

    // Valkyrien Skies (Compat)
    compileOnly ("org.valkyrienskies.core:api:$valk_skies_api_version")
    compileOnly ("org.valkyrienskies.core:impl:$valk_skies_api_version")
    compileOnly ("org.valkyrienskies.core:api-game:$valk_skies_api_version")
    compileOnly ("org.valkyrienskies.core:util:$valk_skies_api_version")
    compileOnly ("org.valkyrienskies:valkyrienskies-118-forge:$valk_skies_main_version")
    compileOnly fg.deobf("curse.maven:eureka-ships-654384:5321597")

    // KubeJS (Compat)
    compileOnly fg.deobf("curse.maven:kubejs-238086:4377177")
    compileOnly fg.deobf("curse.maven:rhino-416294:4069880")
    compileOnly ("dev.architectury:architectury-forge:${architectury_version}")
    compileOnly 'thedarkcolour:kotlinforforge:3.12.0'

    // JEI (Compat)
    compileOnly fg.deobf("mezz.jei:jei-${mc_version}-forge:${jei_version}")

    // Mod Compat
    implementation fg.deobf("curse.maven:serene-seasons-291874:3804257")
    implementation fg.deobf("curse.maven:curios-309927:4418032")
    implementation fg.deobf("curse.maven:create-328085:4625533")
    implementation fg.deobf("curse.maven:spoiled-364918:4614781")
    compileOnly fg.deobf("curse.maven:thirst-was-taken-679270:5071551")
    compileOnly fg.deobf("curse.maven:storms-237746:4426524")
    compileOnly fg.deobf("curse.maven:flywheel-486392:4341461")
    compileOnly fg.deobf("curse.maven:vampirism-233029:4082397")
    compileOnly fg.deobf("curse.maven:werewolves-417851:4050257")
    compileOnly("com.tterrag.registrate:Registrate:MC1.18.2-1.1.3")
    compileOnly fg.deobf("curse.maven:primal-winter-393321:4044096")
}

idea.module { downloadJavadoc = downloadSources = true }

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            artifactId = 'coldsweat'
            pom {
                name = 'Cold Sweat'
                description = 'A Minecraft temperature mod with a powerful framework'
                url = 'https://github.com/Momo-Softworks/Cold-Sweat'
                licenses {
                    license {
                        name = 'GNU General Public License v3.0'
                        url = 'https://www.gnu.org/licenses/gpl-3.0.en.html'
                    }
                }
                developers {
                    developer {
                        id = 'mikul'
                        name = 'Mikul'
                    }
                }
                /*scm = {
                    connection = 'scm:git:git://github.com/Momo-Softworks/Cold-Sweat.git'
                    developerConnection = 'scm:git:ssh://github.com/Momo-Softworks/Cold-Sweat.git'
                    url = 'https://github.com/Momo-Softworks/Cold-Sweat'
                }*/
            }
        }
    }

    repositories {
        maven {
            name = "OSSRH"
            url = "https://s01.oss.sonatype.org/service/local/staging/deploy/maven2/"
            credentials {
                username = System.getenv("SONATYPE_USERNAME")
                password = System.getenv("SONATYPE_PASSWORD")
            }
        }
    }
}

// Example for how to get properties into the manifest for reading at runtime.
jar {
    manifest {
        attributes([
                "Specification-Title"     : "cold_sweat",
                "Specification-Vendor"    : "Mikul",
                "Specification-Version"   : "1", // We are version 1 of ourselves
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : project.jar.archiveVersion,
                "Implementation-Vendor"   : "Mikul",
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                "TweakerClass"            : "org.spongepowered.asm.launch.MixinTweaker",
                "TweakOrder"              : 0,
                "MixinConfigs"            : "cold_sweat.mixin.json"
        ])
    }
}

jar.finalizedBy('reobfJar')

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}
