plugins {
    id 'java-library'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_name
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}

// Compat integrations whose target mods have no 26.2 release yet.
// Remove an entry once the mod is updated and its code has been ported.
def compatExcluded = [
        'com/momosoftworks/coldsweat/compat/create/**',
        'com/momosoftworks/coldsweat/compat/kubejs/**',
        'com/momosoftworks/coldsweat/compat/jei/**',
        'com/momosoftworks/coldsweat/compat/curios/**',
        'com/momosoftworks/coldsweat/mixin/compat/**',
        'com/momosoftworks/coldsweat/api/spread_rule/compat/CreatePipeSpreadRule.java',
        'com/momosoftworks/coldsweat/api/temperature/block_temp/compat/CreateFluidPipeTemp.java',
        'com/momosoftworks/coldsweat/api/temperature/block_temp/compat/CreateFluidTankTemp.java',
        'com/momosoftworks/coldsweat/api/temperature/modifier/compat/SereneSeasonsTempModifier.java',
        'com/momosoftworks/coldsweat/api/temperature/modifier/compat/StormTempModifier.java',
]
sourceSets.main.java { compatExcluded.each { exclude it } }

neoForge {
    version = project.neo_version

    accessTransformers {
        file("src/main/resources/META-INF/accesstransformer.cfg")
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        configureEach {
            // Keep 26.2 dev worlds/configs separate from the 1.21 ones in run/
            gameDirectory = project.file('run-26.2')
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

repositories {
    mavenCentral()
    maven {
        name = 'Minecraft libraries'
        url = 'https://libraries.minecraft.net'
    }
    maven {
        name = "CurseForge"
        url 'https://www.cursemaven.com'
        content {
            includeGroup "curse.maven"
        }
    }
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content {
            includeGroup "maven.modrinth"
        }
    }
    maven {
        name = "Architectury"
        url = "https://maven.architectury.dev"
        content {
            includeGroup "dev.architectury"
        }
    }
    maven {
        name = "KubeJS"
        url "https://maven.latvian.dev/releases"
        content {
            includeGroup "dev.latvian.mods"
            includeGroup "dev.latvian.apps"
        }
    }
    maven {
        url 'https://jitpack.io'
        content {
            includeGroup "com.github.rtyley"
        }
    }
    maven {
        name = "Create API"
        url = "https://maven.createmod.net"
    }
    maven {
        name = "Jared's maven (JEI)"
        url = "https://maven.blamejared.com/"
    }
    maven {
        url 'https://jitpack.io'
    }
    maven {
        name = "Registrate"
        url "https://maven.ithundxr.dev/snapshots"
    }
    maven {
        name = "Sable Companion"
        url = "https://maven.ryanhcode.dev/releases"
    }
}

dependencies {
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-Xmaxerrs' << '100000'
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
