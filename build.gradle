plugins {
    id 'java-library'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.107'
}

version = mod_version
group = mod_group_id

java {
    archivesBaseName = mod_name
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

neoForge {
    version = project.neo_version

    accessTransformers {
        file("src/main/resources/META-INF/accesstransformer.cfg")
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

repositories {
    mavenCentral()
    maven {
        name = 'Minecraft libraries'
        url = 'https://libraries.minecraft.net'
    }
    maven {
        name = "CurseForge"
        url 'https://www.cursemaven.com'
        content {
            includeGroup "curse.maven"
        }
    }
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content {
            includeGroup "maven.modrinth"
        }
    }
    maven {
        name = "Architectury"
        url = "https://maven.architectury.dev"
        content {
            includeGroup "dev.architectury"
        }
    }
    maven {
        name = "KubeJS"
        url "https://maven.latvian.dev/releases"
        content {
            includeGroup "dev.latvian.mods"
            includeGroup "dev.latvian.apps"
        }
    }
    maven {
        url 'https://jitpack.io'
        content {
            includeGroup "com.github.rtyley"
        }
    }
    maven {
        name = "Create API"
        url = "https://maven.createmod.net"
    }
    maven {
        name = "Jared's maven (JEI)"
        url = "https://maven.blamejared.com/"
    }
    maven {
        url 'https://jitpack.io'
    }
    maven {
        name = "Registrate"
        url "https://maven.ithundxr.dev/snapshots"
    }
}

dependencies {
    compileOnly "curse.maven:tough-as-nails-246391:5833252"

    compileOnly "curse.maven:thirst-was-taken-679270:7017923"
    implementation "curse.maven:serene-seasons-291874:5613014"
    implementation "curse.maven:glitchcore-955399:5645390"
    implementation "curse.maven:spoiled-364918:6828999"
    implementation "curse.maven:curios-309927:6529130"
    implementation "curse.maven:iceberg-520110:6423863"
    compileOnly "curse.maven:primal-winter-393321:5811975"

    // Create (Compat)
    implementation "curse.maven:create-328085:7149903"
    compileOnly("net.createmod.ponder:Ponder-NeoForge-1.21.1:1.0.39")
    compileOnly "com.tterrag.registrate:Registrate:MC1.21-1.3.0+67"

    // KubeJS (Compat)
    implementation "dev.latvian.mods:kubejs-neoforge:${kubejs_version}"
    implementation "dev.latvian.apps:tiny-java-server:${tiny_server_version}"
    implementation "com.github.rtyley:animated-gif-lib-for-java:animated-gif-lib-1.7"

    // JEI (Compat)
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"

    // Runtime mods
    runtimeOnly "curse.maven:jei-238222:7057366"
    //runtimeOnly "curse.maven:spark-361579:5434153"
    runtimeOnly "curse.maven:biomes-o-plenty-220318:6631072"
    runtimeOnly "curse.maven:terrablender-neoforge-940057:6054947"
    runtimeOnly "curse.maven:glitchcore-955399:5660740"
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
