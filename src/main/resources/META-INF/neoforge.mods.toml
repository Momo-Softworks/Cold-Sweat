[[mods]]
    modId="cold_sweat"
    version="${mod_version}"
    displayName="Cold Sweat"
    authors="iMikul, chubbymomo, skinnymomo"
    description='''
    Cold Sweat is a highly-extensible temperature mod for Minecraft. See the documentation here:
    https://mikul.gitbook.io/cold-sweat/
    '''

[[mixins]]
    config="cold_sweat.mixin.json"

[[accessTransformers]]
   file="META-INF/accesstransformer.cfg"

[[dependencies.cold_sweat]]
   modId="neoforge"
   type="required"
   versionRange="${neo_version_range}"
   ordering="NONE"
   side="BOTH"

[[dependencies.cold_sweat]]
   modId="minecraft"
   type="required"
   versionRange="${minecraft_version_range}"
   ordering="NONE"
   side="BOTH"
